<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - 秋枫清澄</title>
    <meta name="description" content="秋枫清澄的技术博客文章列表">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景效果 -->
    <div class="page-bg"></div>
    <div class="sakura-container"></div>
    <div class="fireflies-container"></div>
    
    <!-- 滚动进度条 -->
    <div class="scroll-progress">
        <div class="scroll-progress-bar" id="progressBar"></div>
    </div>
    
    <!-- 内容包装器（用于flex布局让footer贴合底部） -->
    <div class="page-wrapper">
        <!-- 导航栏 -->
        <nav class="nav">
            <div class="nav-content">
                <a href="index.html" class="logo">秋枫清澄</a>
                <div class="nav-links">
                    <a href="index.html">🏠 首页</a>
                    <a href="articles.html" class="active">📚 文章</a>
                    <a href="index.html#about">💭 关于</a>
                </div>
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span class="theme-icon">🌙</span>
                </button>
                <button class="back-to-top" id="backToTop" title="回到顶部">
                    <span>↑</span>
                </button>
                <button class="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
        
        <!-- 文章列表区域 -->
        <section class="posts-section" id="articles">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">📚 所有文章</h2>
                    <p class="section-subtitle">持续更新中...</p>
                </div>
                <div class="posts-grid" id="articlesList">
                    <!-- 文章将由 JavaScript 动态渲染 -->
                </div>
            </div>
        </section>
        
        <!-- 页脚 -->
        <footer class="footer">
            <div class="container">
                <div class="footer-links">
                    <a href="https://github.com/shirooaz" target="_blank" title="GitHub">🐱</a>
                    <a href="https://twitter.com" target="_blank" title="Twitter">🐦</a>
                    <a href="mailto:qiufengqingcheng@gmail.com" title="邮箱">📧</a>
                </div>
                <div class="footer-content">
                    <p>© 2024 秋枫清澄 · 用心记录每一天</p>
                    <p>Made with ❤️ and ☕</p>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
