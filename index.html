<!-- ====== 左侧栏：博客 ====== -->

<!-- ====== 中央：构成主义插画 ====== -->
<main class="center-art">
  <svg viewBox="0 0 600 600" class="constructivist-svg" id="mainArt">
    <!-- 背景网格线 -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      </pattern>
      <radialGradient id="redGlow">
        <stop offset="0%" stop-color="#e63946" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff6b9d"/>
        <stop offset="100%" stop-color="#e63946"/>
      </linearGradient>
    </defs>

    <!-- 网格 -->
    <rect width="600" height="600" fill="url(#grid)"/>

    <!-- 大红色圆 — 构成主义核心元素 -->
    <circle cx="310" cy="270" r="155" fill="url(#redGlow)" class="art-pulse"/>
    <circle cx="310" cy="270" r="150" fill="none" stroke="#e63946" stroke-width="2.5" opacity="0.8" class="art-rotate-slow"/>
    <circle cx="310" cy="270" r="140" fill="none" stroke="#e63946" stroke-width="1" opacity="0.4" stroke-dasharray="30 15" class="art-rotate-rev"/>

    <!-- 黑色斜向矩形 — 构成主义标志性元素 -->
    <g transform="rotate(22 310 270)" opacity="0.9">
      <rect x="270" y="80" width="80" height="380" fill="#0a0a0f" stroke="#f0f0f0" stroke-width="1"/>
      <rect x="280" y="100" width="60" height="180" fill="#e63946" opacity="0.7"/>
    </g>

    <!-- 白色三角形 -->
    <polygon points="310,60 480,330 140,330" fill="none" stroke="#f0f0f0" stroke-width="1.5" opacity="0.6" class="art-float"/>

    <!-- 金色小圆 -->
    <circle cx="460" cy="400" r="28" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.7" class="art-float-delay"/>
    <circle cx="460" cy="400" r="18" fill="#ffd700" opacity="0.1"/>

    <!-- 斜线交叉 -->
    <line x1="20" y1="20"  x2="580" y2="580" stroke="#f0f0f0" stroke-width="0.5" opacity="0.2"/>
    <line x1="580" y1="20"  x2="20"  y2="580" stroke="#f0f0f0" stroke-width="0.5" opacity="0.2"/>
    <line x1="300" y1="0"   x2="300" y2="600" stroke="#f0f0f0" stroke-width="0.3" opacity="0.15"/>
    <line x1="0"   y1="300" x2="600" y2="300" stroke="#f0f0f0" stroke-width="0.3" opacity="0.15"/>

    <!-- 交叉点圆点 -->
    <circle cx="300" cy="300" r="5" fill="#e63946" class="art-pulse"/>
    <circle cx="310" cy="270" r="3" fill="#f0f0f0"/>

    <!-- 小几何方块群 -->
    <rect x="130" y="420" width="16" height="16" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.6" class="art-float-delay"/>
    <rect x="155" y="430" width="12" height="12" fill="#ff6b9d" opacity="0.3" class="art-float"/>
    <rect x="440" y="150" width="14" height="14" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5" class="art-float-delay"/>
    <rect x="460" y="170" width="10" height="10" fill="#ffd700" opacity="0.2" class="art-float"/>

    <!-- 构成主义文字 -->
    <text x="310" y="530" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="900" fill="#f0f0f0" opacity="0.04" letter-spacing="20">构成主义</text>

    <!-- 下方刻度线 -->
    <g opacity="0.25">
      <line x1="80"  y1="550" x2="130" y2="550" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="160" y1="550" x2="190" y2="550" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="220" y1="550" x2="250" y2="550" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="350" y1="550" x2="380" y2="550" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="410" y1="550" x2="440" y2="550" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="470" y1="550" x2="520" y2="550" stroke="#f0f0f0" stroke-width="2"/>
    </g>

    <!-- 上方刻度线 -->
    <g opacity="0.25">
      <line x1="80"  y1="50" x2="130" y2="50" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="160" y1="50" x2="190" y2="50" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="220" y1="50" x2="250" y2="50" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="350" y1="50" x2="380" y2="50" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="410" y1="50" x2="440" y2="50" stroke="#f0f0f0" stroke-width="2"/>
      <line x1="470" y1="50" x2="520" y2="50" stroke="#f0f0f0" stroke-width="2"/>
    </g>
  </svg>

  <!-- 插图切换按钮 -->
  <div class="art-controls">
    <button class="art-btn active" data-variant="0" title="构成 I">●</button>
    <button class="art-btn" data-variant="1" title="构成 II">◆</button>
    <button class="art-btn" data-variant="2" title="构成 III">■</button>
  </div>
</main>

<!-- ====== 底部栏：留言板 ====== -->
<footer class="bottom-bar">
