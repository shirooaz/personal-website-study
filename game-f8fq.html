<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8d3c8">
  <meta name="description" content="飞八分钱原创浏览器小游戏">
  <title>飞八分钱</title>
  <style>
:root {
  color-scheme: light;
  --paper: #d8d3c8;
  --paper-bright: #f3efe6;
  --paper-deep: #aaa49a;
  --ink: #171614;
  --ink-soft: #5e5a53;
  --vermilion: #e23c32;
  --copper: #b97936;
  --line: rgba(23, 22, 20, 0.28);
  --shadow-hard: 7px 7px 0 rgba(23, 22, 20, 0.88);
  --radius: 4px;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: var(--ink);
  background: var(--paper-deep);
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button,
label,
.playfield {
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

.app {
  width: 100vw;
  height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  position: relative;
  isolation: isolate;
}

.app::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: 0.22;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 5px, rgba(23, 22, 20, 0.14) 6px),
    repeating-linear-gradient(90deg, transparent 0 10px, rgba(243, 239, 230, 0.12) 11px);
  pointer-events: none;
}

.game-shell {
  --local-paper: var(--paper);
  --local-paper-bright: var(--paper-bright);
  --local-ink: var(--ink);
  --local-ink-soft: var(--ink-soft);
  width: min(1180px, calc(100vw - 24px));
  height: min(760px, calc(100dvh - 24px));
  min-height: 420px;
  display: grid;
  grid-template-rows: 76px minmax(0, 1fr);
  overflow: hidden;
  position: relative;
  color: var(--local-ink);
  background: var(--local-paper);
  border: 2px solid var(--local-ink);
  box-shadow: var(--shadow-hard);
  container-type: inline-size;
}

.game-shell[data-theme="newsprint"] {
  --local-paper: #eee9df;
  --local-paper-bright: #fffaf0;
  --local-ink: #292622;
  --local-ink-soft: #70695f;
}

.game-shell[data-theme="night"] {
  --local-paper: #242220;
  --local-paper-bright: #34312d;
  --local-ink: #f0ebe1;
  --local-ink-soft: #aca69d;
}

.hud {
  position: relative;
  z-index: 30;
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  align-items: center;
  gap: var(--space-2);
  padding: 10px 14px;
  background: var(--local-paper-bright);
  border-bottom: 2px solid var(--local-ink);
}

.cent-hud {
  min-width: 0;
  display: grid;
  grid-template-columns: auto auto minmax(64px, 210px);
  align-items: center;
  gap: 10px;
}

.wordmark {
  font-family: "STZhongsong", "SimHei", sans-serif;
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}

.cent-readout {
  display: flex;
  align-items: baseline;
  gap: 3px;
  white-space: nowrap;
}

.cent-readout strong,
.score-hud strong,
.result-grid dd {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-weight: 400;
  letter-spacing: 0;
}

.cent-readout strong {
  color: var(--vermilion);
  font-size: 28px;
  line-height: 1;
}

.cent-readout span {
  color: var(--local-ink-soft);
  font-size: 12px;
  font-weight: 800;
}

.cent-dots {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
}

.cent-dots i {
  height: 10px;
  background: transparent;
  border: 1px solid var(--local-ink);
  transition: background 140ms ease, transform 140ms var(--ease-snap);
}

.cent-dots i.is-filled {
  background: var(--copper);
  transform: translateY(-2px);
}

.score-hud {
  min-width: 92px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 9px;
}

.score-hud span {
  color: var(--local-ink-soft);
  font-size: 11px;
  font-weight: 800;
}

.score-hud strong {
  min-width: 48px;
  font-size: 36px;
  line-height: 1;
  text-align: left;
}

.hud-tools {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.icon-button {
  width: 46px;
  height: 46px;
  display: inline-grid;
  place-items: center;
  padding: 0;
  position: relative;
  color: var(--local-ink);
  background: transparent;
  border: 1px solid var(--local-ink);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 120ms var(--ease-snap), color 120ms ease, background 120ms ease, opacity 120ms ease;
}

.icon-button svg,
.command-button svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-button svg polygon,
.command-button svg polygon {
  fill: currentColor;
  stroke: currentColor;
}

.icon-button:hover,
.icon-button:focus-visible {
  color: var(--local-paper-bright);
  background: var(--local-ink);
  outline: none;
}

.icon-button:active {
  transform: translateY(2px);
}

.icon-button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.icon-button[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 9px);
  left: 50%;
  z-index: 100;
  padding: 5px 7px;
  color: var(--paper-bright);
  background: var(--ink);
  border: 1px solid var(--paper-bright);
  border-radius: 2px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -3px);
  transition: opacity 100ms ease, transform 100ms ease;
}

.icon-button[data-tooltip]:hover::after,
.icon-button[data-tooltip]:focus-visible::after {
  opacity: 1;
  transform: translate(-50%, 0);
}

.playfield {
  min-height: 0;
  overflow: hidden;
  position: relative;
  background: var(--local-paper);
  touch-action: manipulation;
  user-select: none;
}

#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.state-overlay {
  position: absolute;
  z-index: 20;
}

.ready-state {
  inset: 0 auto 0 0;
  width: min(39%, 430px);
  min-width: 330px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(28px, 4cqw, 48px);
  color: var(--paper-bright);
  background: rgba(23, 22, 20, 0.94);
  border-right: 2px solid var(--local-ink);
}

.state-copy {
  text-wrap: pretty;
}

.state-kicker {
  margin: 0 0 14px;
  color: var(--copper);
  font-family: Consolas, monospace;
  font-size: 11px;
  font-weight: 800;
}

.state-copy h1,
.state-copy h2,
.state-copy p {
  margin: 0;
}

.state-copy h1,
.state-copy h2 {
  font-family: "STZhongsong", "SimHei", sans-serif;
  font-weight: 900;
  letter-spacing: 0;
}

.state-copy h1 {
  max-width: 6em;
  font-size: clamp(50px, 7cqw, 88px);
  line-height: 0.96;
}

.state-copy h2 {
  font-size: 46px;
  line-height: 1;
}

.state-copy h1 + p,
.state-copy h2 + p {
  margin-top: 18px;
  color: color-mix(in srgb, currentColor 72%, transparent);
  font-size: 15px;
  font-weight: 700;
}

.command-button {
  min-width: 154px;
  min-height: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 0 20px;
  color: var(--local-ink);
  background: var(--local-paper-bright);
  border: 2px solid var(--local-ink);
  border-radius: var(--radius);
  box-shadow: 5px 5px 0 var(--copper);
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: transform 140ms var(--ease-snap), box-shadow 140ms var(--ease-snap), background 120ms ease;
}

.command-button--primary {
  color: var(--paper-bright);
  background: var(--vermilion);
  border-color: var(--paper-bright);
}

.command-button:hover,
.command-button:focus-visible {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 var(--copper);
  outline: 2px solid var(--copper);
  outline-offset: 3px;
}

.command-button:active {
  transform: translate(3px, 3px);
  box-shadow: 2px 2px 0 var(--copper);
}

.modal-state {
  inset: 50% auto auto 50%;
  width: min(370px, calc(100% - 32px));
  display: grid;
  gap: 26px;
  padding: 30px;
  color: var(--local-ink);
  background: var(--local-paper-bright);
  border: 2px solid var(--local-ink);
  box-shadow: 9px 9px 0 var(--copper);
  transform: translate(-50%, -50%);
}

.modal-state .command-button {
  width: 100%;
}

.gameover-state {
  width: min(410px, calc(100% - 32px));
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 0;
  background: var(--local-ink);
  border: 1px solid var(--local-ink);
}

.result-grid div {
  padding: 14px 16px;
  background: var(--local-paper);
}

.result-grid dt {
  color: var(--local-ink-soft);
  font-size: 11px;
  font-weight: 800;
}

.result-grid dd {
  margin: 4px 0 0;
  font-size: 40px;
}

.error-state {
  inset: 0;
  display: grid;
  place-items: center;
  padding: 32px;
  text-align: center;
  color: var(--paper-bright);
  background: var(--ink);
}

.combo-banner {
  position: absolute;
  left: 50%;
  top: 22%;
  z-index: 25;
  min-width: 170px;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  padding: 12px 18px;
  color: var(--paper-bright);
  background: var(--vermilion);
  border: 2px solid var(--ink);
  box-shadow: 6px 6px 0 var(--copper);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -12px) scale(0.92);
}

.combo-banner.is-visible {
  animation: combo-pop 780ms var(--ease-snap) both;
}

.combo-banner span {
  font-family: "STZhongsong", "SimHei", sans-serif;
  font-size: 22px;
  font-weight: 900;
}

.combo-banner strong {
  font-family: Impact, sans-serif;
  font-size: 36px;
  font-weight: 400;
}

.tweaks-panel {
  position: absolute;
  top: 76px;
  right: 0;
  bottom: 0;
  z-index: 60;
  width: min(350px, calc(100% - 24px));
  padding: 22px;
  color: var(--paper-bright);
  background: rgba(23, 22, 20, 0.97);
  border-left: 2px solid var(--paper-bright);
  box-shadow: -8px 0 0 var(--copper);
  overflow-y: auto;
}

.tweaks-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(243, 239, 230, 0.28);
}

.tweaks-header span {
  color: var(--copper);
  font-size: 10px;
  font-weight: 800;
}

.tweaks-header h2 {
  margin: 4px 0 0;
  font-family: Consolas, monospace;
  font-size: 26px;
  letter-spacing: 0;
}

.icon-button--light {
  flex: 0 0 auto;
  color: var(--paper-bright);
  border-color: var(--paper-bright);
}

.control-group {
  min-width: 0;
  margin: 22px 0 0;
  padding: 0;
  border: 0;
}

.control-group legend {
  margin-bottom: 9px;
  color: rgba(243, 239, 230, 0.68);
  font-size: 11px;
  font-weight: 800;
}

.segmented-control {
  display: grid;
  gap: 2px;
  padding: 2px;
  background: var(--paper-bright);
  border: 1px solid var(--paper-bright);
  border-radius: var(--radius);
}

.segmented-control--three {
  grid-template-columns: repeat(3, 1fr);
}

.segmented-control label {
  min-width: 0;
  min-height: 44px;
  display: grid;
  place-items: center;
  position: relative;
  color: var(--paper-bright);
  background: var(--ink);
  cursor: pointer;
}

.segmented-control input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.segmented-control span {
  font-size: 12px;
  font-weight: 800;
}

.segmented-control input:checked + span {
  color: var(--ink);
}

.segmented-control label:has(input:checked) {
  background: var(--copper);
}

.segmented-control label:has(input:focus-visible) {
  outline: 2px solid var(--vermilion);
  outline-offset: -3px;
}

.switch-row {
  display: grid;
  gap: 1px;
  margin-top: 22px;
  background: rgba(243, 239, 230, 0.24);
  border-top: 1px solid rgba(243, 239, 230, 0.24);
  border-bottom: 1px solid rgba(243, 239, 230, 0.24);
}

.switch-row label {
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 4px;
  background: var(--ink);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.switch-row input {
  width: 46px;
  height: 26px;
  margin: 0;
  appearance: none;
  position: relative;
  background: #5e5a53;
  border: 1px solid var(--paper-bright);
  border-radius: 13px;
  cursor: pointer;
}

.switch-row input::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  background: var(--paper-bright);
  border-radius: 50%;
  transition: transform 140ms var(--ease-snap);
}

.switch-row input:checked {
  background: var(--vermilion);
}

.switch-row input:checked::after {
  transform: translateX(20px);
}

.switch-row input:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 3px;
}

.sr-status {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.noscript-message {
  position: absolute;
  inset: 50% auto auto 50%;
  z-index: 80;
  margin: 0;
  padding: 18px;
  color: var(--paper-bright);
  background: var(--ink);
  border: 2px solid var(--paper-bright);
  transform: translate(-50%, -50%);
}

@keyframes combo-pop {
  0% { opacity: 0; transform: translate(-50%, -12px) scale(0.92); }
  24% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  72% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, 12px) scale(0.96); }
}

@container (max-width: 760px) {
  .hud {
    grid-template-columns: minmax(116px, 1fr) auto minmax(156px, 1fr);
    gap: 8px;
    padding-inline: 10px;
  }

  .cent-hud {
    grid-template-columns: auto minmax(56px, 1fr);
    gap: 7px;
  }

  .wordmark {
    display: none;
  }

  .cent-dots {
    grid-column: 1 / -1;
  }

  .cent-readout strong {
    font-size: 24px;
  }

  .score-hud {
    min-width: 70px;
  }

  .score-hud span {
    display: none;
  }

  .score-hud strong {
    min-width: 0;
    font-size: 32px;
    text-align: center;
  }

  .hud-tools {
    gap: 6px;
  }

  .icon-button {
    width: 44px;
    height: 44px;
  }

  .ready-state {
    inset: auto 14px 14px 14px;
    width: auto;
    min-width: 0;
    min-height: 250px;
    padding: 24px;
    border: 2px solid var(--local-ink);
    box-shadow: 6px 6px 0 var(--copper);
  }

  .state-copy h1 {
    font-size: clamp(50px, 12cqw, 68px);
  }

  .state-copy h1 + p {
    margin-top: 12px;
  }

  .ready-state .command-button {
    width: 100%;
  }
}

@media (max-width: 720px) and (orientation: portrait) {
  .app {
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }

  .game-shell {
    width: calc(100vw - 16px);
    height: calc(100dvh - 16px);
    min-height: 0;
    grid-template-rows: 72px minmax(0, 1fr);
    box-shadow: 5px 5px 0 rgba(23, 22, 20, 0.88);
  }

  .hud {
    grid-template-columns: minmax(84px, 1fr) 52px auto;
  }

  .cent-dots {
    gap: 2px;
  }

  .cent-dots i {
    height: 8px;
  }

  .icon-button[data-tooltip]::after {
    display: none;
  }

  .ready-state {
    min-height: min(270px, 40%);
    padding: 20px;
  }

  .state-copy h1 {
    font-size: clamp(46px, 15vw, 64px);
  }

  .modal-state {
    padding: 24px;
  }

  .state-copy h2 {
    font-size: 40px;
  }

  .tweaks-panel {
    top: 72px;
    width: min(330px, calc(100% - 18px));
    padding: 18px;
  }
}

@media (max-height: 560px) and (orientation: landscape) {
  .game-shell {
    grid-template-rows: 64px minmax(0, 1fr);
  }

  .hud {
    padding-block: 7px;
  }

  .icon-button {
    width: 44px;
    height: 44px;
  }

  .ready-state {
    padding: 22px;
  }

  .state-copy h1 {
    font-size: 48px;
  }

  .tweaks-panel {
    top: 64px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="game-shell" id="gameShell" data-theme="ruins" aria-label="飞八分钱游戏">
      <header class="hud">
        <div class="cent-hud" aria-label="八分钱进度">
          <span class="wordmark">飞八分钱</span>
          <div class="cent-readout">
            <strong id="centCount">0</strong><span>/ 8</span>
          </div>
          <div class="cent-dots" id="centDots" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>

        <div class="score-hud" aria-label="本局分数">
          <span>本局</span>
          <strong id="scoreValue">00</strong>
        </div>

        <nav class="hud-tools" aria-label="游戏工具">
          <button class="icon-button" id="muteButton" type="button" aria-label="静音" aria-pressed="false" data-tooltip="静音">
            <svg class="icon-volume" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="icon-volume-x" aria-hidden="true" viewBox="0 0 24 24" hidden>
              <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
              <path d="m22 9-6 6"></path>
              <path d="m16 9 6 6"></path>
            </svg>
          </button>
          <button class="icon-button" id="pauseButton" type="button" aria-label="暂停" data-tooltip="暂停" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect width="4" height="16" x="6" y="4" rx="1"></rect>
              <rect width="4" height="16" x="14" y="4" rx="1"></rect>
            </svg>
          </button>
          <button class="icon-button" id="tweaksButton" type="button" aria-label="打开调校面板" aria-expanded="false" data-tooltip="调校">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <line x1="21" x2="14" y1="4" y2="4"></line>
              <line x1="10" x2="3" y1="4" y2="4"></line>
              <line x1="21" x2="12" y1="12" y2="12"></line>
              <line x1="8" x2="3" y1="12" y2="12"></line>
              <line x1="21" x2="16" y1="20" y2="20"></line>
              <line x1="12" x2="3" y1="20" y2="20"></line>
              <line x1="14" x2="14" y1="2" y2="6"></line>
              <line x1="8" x2="8" y1="10" y2="14"></line>
              <line x1="16" x2="16" y1="18" y2="22"></line>
            </svg>
          </button>
        </nav>

(function bootstrapF8FQ(global) {
