name = "guestbook-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "GUESTBOOK_KV"
id = "b771e3e02029413aad066a86f59ed4e7"

# 文章接口（/api/articles*）目前是死代码：前端从未调用它，账号里也没有对应的 D1 数据库
# （wrangler d1 list 为空，线上 /api/articles 返回 404 —— 说明这块从未真正部署过）。
# 而占位符 database_id 会让 `wrangler deploy` 直接失败（错误码 10021），所以先注释掉绑定。
# 想启用：wrangler d1 create articles-db → 把返回的 id 填进来 → 取消注释 → 执行 schema.sql。
# [[d1_databases]]
# binding = "ARTICLES_DB"
# database_name = "articles-db"
# database_id = "<wrangler d1 create articles-db 返回的 id>"

[vars]
ALLOWED_ORIGIN = "https://153904.xyz"
# ADMIN_TOKEN 不写在这里，用 `wrangler secret put ADMIN_TOKEN` 配置。
# 未配置时 checkAuth 一律返回 false（写接口全部拒绝）。

[[routes]]
pattern = "api.153904.xyz/*"
zone_name = "153904.xyz"

[observability]
enabled = true
